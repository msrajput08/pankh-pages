name: Expand uploaded complete project
on:
  push:
    paths:
      - ".github/workflows/expand-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack complete PankhPages project
        run: |
          base64 --decode .github-transfer/source.tar.xz.b64 > /tmp/pankhpages.tar.xz
          echo "27c95391255e4d8469550f78d8509ad4e9de5cec710dbfc0da76586c3d65fcb3  /tmp/pankhpages.tar.xz" | sha256sum -c -
          tar -xJf /tmp/pankhpages.tar.xz -C .
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f scripts/build.mjs
          test -f src/catalog.mjs
          test -f assets/NotoSansDevanagari-Regular.ttf
          test -f dist/google3d4d24a07fe849ba.html
          test "$(find dist -name index.html | wc -l)" -ge 29
          node scripts/check.mjs
          rm -f .github-transfer/source.tar.xz.b64
          rm -f .github/workflows/import-existing-site.yml scripts/import_public.py
      - name: Commit expanded website and editable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete PankhPages source and production website"
          git push origin HEAD:main
